name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff (lint)
        run: ruff check .
      - name: ruff (format)
        run: ruff format --check .
      - name: mypy
        run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: pin matplotlib to the baseline version (3.12 job compares pixels)
        if: matrix.python-version == '3.12'
        run: pip install "matplotlib==$(cat tests/baseline/MATPLOTLIB_VERSION)"
      - name: pytest (unit, guards, visual regression; realdata suite is opt-in)
        run: pytest --mpl-results-path=mpl-results
      - name: upload image diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mpl-results-${{ matrix.python-version }}
          path: mpl-results

  omics-extra:
    # M0 acceptance: `pip install -e .[omics]` works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[omics,dev]"
      - run: python -c "import tincture, pydeseq2, decoupler, scanpy; print(tincture.__version__)"
      - run: pytest -q
